name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: koe-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Test extension
        shell: zsh
        run: |
          set -euo pipefail
          for test_file in test/*.test.js; do
            node "$test_file"
          done
          for script_file in \
            background.js \
            content.js \
            media-discovery.js \
            offscreen.js \
            popup.js \
            sidepanel.js; do
            node --check "$script_file"
          done

      - name: Validate helper core
        run: swift run --package-path helper koe-helper-core-checks

      - name: Build release preview
        env:
          KOE_DIST_DIR: ${{ runner.temp }}/koe-dist
        run: scripts/package-release.sh
