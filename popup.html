<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Koe</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main class="shell">
      <header class="masthead">
        <img class="avatar" src="assets/koe-avatar-48.png" alt="Koe">
        <div class="titles">
          <h1>Koe</h1>
          <span id="version"></span>
        </div>
        <span class="dot" id="status-dot"></span>
      </header>
      <button id="start-button" class="start-button" type="button">开启实时字幕</button>
      <button id="open-panel" class="secondary-button" type="button">打开字幕记录与设置</button>
      <p class="status" id="status-text">字幕会贴在视频画面上</p>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
