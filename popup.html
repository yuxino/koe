<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Koe</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main class="shell">
      <header class="masthead">
        <img class="avatar" src="assets/koe-avatar-48.png" alt="Koe">
        <div>
          <div class="kicker">VOICE / CAPTION LAB</div>
          <h1>Koe</h1>
        </div>
        <span class="batch-mark" id="batch-mark">BATCH</span>
      </header>

      <section class="current-tab">
        <span class="section-label">CURRENT TAB</span>
        <strong id="tab-host">正在读取…</strong>
        <span id="tab-title">先完整分析，再加载字幕。</span>
      </section>

      <section class="control-card">
        <div class="control-copy">
          <span class="section-label">CAPTION ENGINE</span>
          <strong id="engine-status">准备就绪</strong>
          <span id="engine-detail">批处理服务 · 检查中</span>
        </div>
        <button id="toggle" class="toggle" type="button">Analyze video</button>
      </section>

      <label class="server-field file-field">
        <span class="section-label">LOCAL VIDEO <em>OPTIONAL</em></span>
        <input id="video-file" type="file" accept="video/*,.mp4,.webm,.mov,.mkv">
        <small>网页拿不到源文件时，可直接选择本地视频。</small>
      </label>

      <label class="server-field">
        <span class="section-label">LOCAL SERVICE</span>
        <input id="server-url" type="url" value="https://koe-api.yuxino.cn" spellcheck="false">
      </label>

      <label class="server-field token-field">
        <span class="section-label">API TOKEN <em>OPTIONAL</em></span>
        <input id="api-token" type="password" placeholder="服务器开启保护时填写" spellcheck="false" autocomplete="off">
      </label>

      <footer>
        <span id="hint">不会实时显示字幕，整段分析完成后才加载。</span>
        <a href="https://github.com/yuxino/ding-frame" target="_blank" rel="noreferrer">based on ding-frame ↗</a>
      </footer>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
