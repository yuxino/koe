<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Koe</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main class="shell">
      <header class="masthead">
        <img class="avatar" src="assets/koe-avatar-48.png" alt="Koe">
        <div class="titles">
          <h1>Koe</h1>
          <span class="version" id="version"></span>
        </div>
        <span class="dot" id="status-dot" title="状态"></span>
      </header>

      <section class="status-card">
        <div class="status-line">
          <strong id="engine-status">未开启</strong>
          <span id="engine-detail">打开此弹窗或按 Alt+K 开启</span>
        </div>
      </section>

      <button id="start-button" class="start-button" type="button">开始实时字幕</button>

      <label class="toggle-row" for="translate-toggle">
        <span>显示中文翻译</span>
        <input type="checkbox" id="translate-toggle" checked>
      </label>

      <footer>
        <span id="hint"></span>
      </footer>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
