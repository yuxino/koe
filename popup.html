<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Koe</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main class="shell">
      <header class="masthead">
        <img class="avatar" src="assets/koe-avatar-48.png" alt="Koe">
        <div>
          <div class="kicker">VOICE / CAPTION LAB</div>
          <h1>Koe</h1>
        </div>
        <span class="version" id="version"></span>
        <span class="batch-mark" id="batch-mark">BATCH</span>
      </header>

      <section class="current-tab">
        <span class="section-label">CURRENT TAB</span>
        <strong id="tab-host">正在读取…</strong>
        <span id="tab-title">先完整分析，再加载字幕。</span>
      </section>

      <section class="video-picker">
        <span class="section-label">VIDEO</span>
        <select id="video-select" disabled>
          <option value="">正在扫描视频…</option>
        </select>
        <label class="auto-toggle" for="translate-toggle">
          <input type="checkbox" id="translate-toggle" checked>
          <span>双语字幕：原文 + 中文翻译</span>
        </label>
        <label class="auto-toggle" for="auto-toggle">
          <input type="checkbox" id="auto-toggle">
          <span>自动分析：打开/刷新页面自动开始</span>
        </label>
      </section>

      <section class="control-card">
        <div class="control-copy">
          <span class="section-label">CAPTION ENGINE</span>
          <strong id="engine-status">准备就绪</strong>
          <span id="engine-detail">批处理服务 · 检查中</span>
        </div>
        <button id="toggle" class="toggle" type="button">Analyze video</button>
      </section>

      <footer>
        <span id="hint">选好视频后点击 Analyze video，整段分析完再加载字幕。</span>
        <a href="https://github.com/yuxino/ding-frame" target="_blank" rel="noreferrer">based on ding-frame ↗</a>
      </footer>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
