<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Koe</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main class="shell">
      <header class="masthead">
        <img class="avatar" src="assets/koe-avatar-48.png" alt="Koe">
        <div>
          <div class="kicker">KOE</div>
          <h1>Koe</h1>
        </div>
        <span class="version" id="version"></span>
      </header>

      <section class="status-card">
        <span class="section-label">状态</span>
        <strong id="engine-status">准备就绪</strong>
        <span id="engine-detail">本地助手 · 检查中</span>
      </section>

      <label class="toggle-row" for="translate-toggle">
        <input type="checkbox" id="translate-toggle" checked>
        <span>双语字幕</span>
      </label>

      <button id="toggle" class="toggle primary" type="button">分析字幕</button>

      <footer>
        <span id="hint"></span>
      </footer>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
