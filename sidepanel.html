<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Koe 字幕</title>
    <link rel="stylesheet" href="sidepanel.css">
  </head>
  <body>
    <main class="shell">
      <header class="masthead">
        <img class="avatar" src="assets/koe-avatar-48.png" alt="Koe">
        <div class="titles">
          <h1>Koe</h1>
          <span class="version" id="version"></span>
        </div>
        <span class="dot" id="status-dot" title="状态"></span>
      </header>

      <button id="start-button" class="start-button" type="button">开启实时字幕</button>

      <label class="toggle-row" for="translate-toggle">
        <span>显示中文翻译</span>
        <input type="checkbox" id="translate-toggle" checked>
      </label>

      <details class="settings" id="settings">
        <summary id="settings-summary">字幕模式与设置</summary>
        <div class="settings-body">
          <label class="field-row" for="capture-mode">
            <span>字幕模式</span>
            <select id="capture-mode">
              <option value="tab-dashscope">标签页声音 · DashScope</option>
              <option value="mic-dashscope">麦克风 · DashScope（免手势）</option>
              <option value="mic-vosk-zh">麦克风 · 本地离线中文（全离线）</option>
              <option value="mic-vosk-en">麦克风 · 本地离线英文（全离线）</option>
              <option value="mic-webspeech">麦克风 · Chrome 内置（免 Key）</option>
            </select>
          </label>
          <label class="field-row" for="api-key">
            <span>DashScope API Key（DashScope 模式需要）</span>
            <input id="api-key" type="password" autocomplete="off" placeholder="sk-...">
          </label>
          <button id="save-key" class="secondary-button" type="button">保存 API Key</button>
        </div>
      </details>

      <div class="feed-actions">
        <span class="feed-title">字幕记录</span>
        <button id="copy-all" class="mini-button" type="button">复制全部</button>
        <button id="clear-feed" class="mini-button" type="button">清空</button>
        <button id="copy-logs" class="mini-button" type="button" title="复制诊断日志，发给开发者定位字幕问题">复制日志</button>
        <button id="clear-logs" class="mini-button" type="button" title="清空诊断日志（下次从零记录）">清空日志</button>
      </div>

      <div class="feed-area">
        <main class="feed" id="feed" aria-live="polite"></main>
        <button id="scroll-bottom" class="scroll-bottom" type="button" hidden>↓ 回到底部</button>
      </div>

      <footer>
        <span id="hint">Alt+K：开启并跟随正在发声的标签页</span>
      </footer>
    </main>
    <script src="sidepanel.js"></script>
  </body>
</html>
